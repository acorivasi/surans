<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surans — Detaliu parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root{
    --cream:#FCEAE0; --stripe:#F3C9B4; --coral:#E1785A; --coral-deep:#C15A3E;
    --coral-pale:#F8DDD0; --ink:#362520; --ink-soft:#8A6A5C; --card:#FFF9F5; --line:#EFD3C2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: repeating-linear-gradient(90deg, var(--cream) 0px, var(--cream) 64px, var(--stripe) 64px, var(--stripe) 128px);
    color:var(--ink); font-family:'Work Sans',sans-serif; font-size:15.5px; line-height:1.6;
  }
  header{ padding:22px 44px; display:flex; justify-content:space-between; align-items:center; background:rgba(255,249,245,0.75); backdrop-filter:blur(3px); border-bottom:1px solid var(--line); }
  .wordmark{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:32px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); text-decoration:none; }
  nav{ display:flex; gap:28px; font-size:14.5px; font-weight:500; }
  nav a{ color:var(--ink); text-decoration:none; }
  nav a:hover{ color:var(--coral-deep); }

  .breadcrumb{ padding:20px 44px 0; font-size:13px; color:var(--ink-soft); max-width:1100px; margin:0 auto; }
  .breadcrumb a{ color:var(--coral-deep); text-decoration:none; }

  main{ max-width:1100px; margin:0 auto; padding:24px 44px 90px; }

  .product-grid{ display:grid; grid-template-columns:420px 1fr; gap:44px; }
  .product-grid > *{ min-width:0; }
  @media (max-width:820px){ .product-grid{ grid-template-columns:1fr; } }

  .photo-frame{ position:relative; padding:9px; }
  .photo-frame::before{ content:""; position:absolute; inset:0; border:1px solid var(--coral); opacity:0.5; border-radius:2px; }
  .corner{ position:absolute; width:11px; height:11px; }
  .corner.tl{ top:-6px; left:-6px; border-top:2px solid var(--coral-deep); border-left:2px solid var(--coral-deep); }
  .corner.tr{ top:-6px; right:-6px; border-top:2px solid var(--coral-deep); border-right:2px solid var(--coral-deep); }
  .corner.bl{ bottom:-6px; left:-6px; border-bottom:2px solid var(--coral-deep); border-left:2px solid var(--coral-deep); }
  .corner.br{ bottom:-6px; right:-6px; border-bottom:2px solid var(--coral-deep); border-right:2px solid var(--coral-deep); }
  .photo-box{ background:#fff; border:1px solid var(--line); height:460px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .photo-box img{ width:100%; height:100%; object-fit:contain; }
  .status-badge{ position:absolute; top:14px; right:14px; font-size:11px; font-weight:600; letter-spacing:.04em; padding:4px 11px; border-radius:12px; background:var(--cream); border:1px solid var(--line); color:var(--ink-soft); }

  .info .brand{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:6px; }
  .info h1{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(30px,4vw,42px); line-height:1.1; margin-bottom:6px; }
  .info .conc{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }

  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .tag{ font-size:12px; font-weight:500; padding:5px 13px; border-radius:14px; border:1px solid var(--line); color:var(--ink-soft); }
  .tag.dupe{ border-color:var(--coral); color:var(--coral-deep); font-weight:600; }

  .pyramid{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:22px 24px; margin-bottom:22px; }
  .pyramid .level{ display:flex; gap:14px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .pyramid .level:last-child{ border-bottom:none; }
  .pyramid .level b{ width:64px; flex-shrink:0; font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--coral-deep); }
  .pyramid .level span{ color:var(--ink); }
  .pyramid .empty-note{ color:var(--ink-soft); font-style:italic; font-size:13px; }

  .desc{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:17px; color:var(--ink-soft); margin-bottom:26px; line-height:1.5; }

  .buy-panel{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px 24px; gap:16px; flex-wrap:wrap; }
  .buy-panel .price{ font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:700; }
  .buy-panel .src{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .buy-btn-lg{ background:var(--coral); color:#fff; text-decoration:none; font-weight:700; font-size:15px; padding:14px 30px; border-radius:24px; white-space:nowrap; box-shadow:0 8px 18px rgba(193,90,62,0.3); }
  .buy-btn-lg:hover{ background:var(--coral-deep); }
  .no-price{ font-style:italic; color:var(--ink-soft); }

  .compare-title{ font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:22px 0 10px; }
  .compare-table{ background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .compare-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 20px; border-bottom:1px solid var(--line); }
  .compare-row:last-child{ border-bottom:none; }
  .compare-row.best{ background:var(--coral-pale); }
  .compare-row .store{ font-weight:600; font-size:14px; }
  .compare-row .best-tag{ font-size:10.5px; font-weight:700; color:var(--coral-deep); text-transform:uppercase; letter-spacing:.04em; margin-left:8px; }
  .compare-row .cprice{ display:flex; align-items:center; gap:14px; }
  .compare-row .cprice .val{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; }
  .compare-row .cbuy{ background:var(--ink); color:#fff; text-decoration:none; font-size:12px; font-weight:600; padding:7px 14px; border-radius:16px; }
  .compare-row .cbuy:hover{ background:var(--coral-deep); }

  .section-title{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:22px; color:var(--coral-deep); margin:50px 0 20px; text-align:center; }
  .similar-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:20px; }
  .sim-card{ background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; text-decoration:none; color:var(--ink); display:block; }
  .sim-card:hover{ border-color:var(--coral); }
  .sim-card .simg{ height:150px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .sim-card .simg img{ width:100%; height:100%; object-fit:contain; }
  .sim-card .sbody{ padding:12px 14px; }
  .sim-card .sbrand{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; }
  .sim-card .sname{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; }
  .sim-card .smatch{ font-size:11px; color:var(--coral-deep); font-weight:600; margin-top:4px; }

  .not-found{ text-align:center; padding:100px 40px; }
  .not-found h1{ font-family:'Cormorant Garamond',serif; font-size:32px; margin-bottom:14px; }
  .not-found a{ color:var(--coral-deep); }

  footer{ padding:26px 44px 50px; font-size:12.5px; color:var(--ink-soft); text-align:center; background:rgba(255,249,245,0.75); border-top:1px solid var(--line); }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="index.html">Surans</a>
  <nav>
    <a href="index.html">Index</a>
    <a href="despre.html">Despre noi</a>
  </nav>
</header>

<div class="breadcrumb" id="breadcrumb"></div>

<main id="main"></main>

<footer>SURANS · fiecare specimen e datat și sursat individual · afilierea nu influențează ordinea</footer>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const p = DATA.find(d => d.id === id);
const main = document.getElementById('main');
const crumb = document.getElementById('breadcrumb');

if(!p){
  crumb.innerHTML = '';
  main.innerHTML = `
    <div class="not-found">
      <h1>Nu am găsit acest parfum</h1>
      <p>Poate a fost mutat sau linkul e greșit. <a href="index.html">Înapoi la arhivă →</a></p>
    </div>`;
} else {
  document.title = `${p.brand} ${p.name} — Surans`;
  crumb.innerHTML = `<a href="index.html">Index</a> / ${p.brand} ${p.name}`;

  const dupeTag = p.dupeOf ? `<span class="tag dupe">Dupe: ${p.dupeOf}</span>` : '';
  const statusLabel = p.status==='verified' ? 'Verificat' : (p.status==='feed' ? 'Din feed' : 'Parțial');
  const visual = p.image
    ? `<img src="${p.image}" alt="${p.brand} ${p.name}">`
    : `<div style="font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--ink-soft);">${p.brand} ${p.name}</div>`;

  const buyBlock = p.price.buyLink
    ? `<div><div class="price">${p.price.val}</div><div class="src">${p.price.src}</div></div>
       <a class="buy-btn-lg" href="${p.price.buyLink}" target="_blank" rel="nofollow sponsored noopener">Cumpără →</a>`
    : `<div class="no-price">${p.price.src}</div>`;

  main.innerHTML = `
    <div class="product-grid">
      <div class="photo-frame">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <div class="photo-box">
          <span class="status-badge">${statusLabel}</span>
          ${visual}
        </div>
      </div>
      <div class="info">
        <div class="brand">${p.brand}</div>
        <h1>${p.name}</h1>
        <div class="conc">${p.conc}</div>
        <div class="tag-row">
          ${p.accords.map(a=>`<span class="tag">${a}</span>`).join('')}
          <span class="tag">${p.type}</span>
          <span class="tag">${p.gender}</span>
          ${dupeTag}
        </div>
        <div class="pyramid">
          <div class="level"><b>Vârf</b><span>${p.top.length ? p.top.join(', ') : '<span class="empty-note">nedocumentat</span>'}</span></div>
          <div class="level"><b>Inimă</b><span>${p.heart.length ? p.heart.join(', ') : '<span class="empty-note">nedocumentat</span>'}</span></div>
          <div class="level"><b>Bază</b><span>${p.base.length ? p.base.join(', ') : '<span class="empty-note">nedocumentat</span>'}</span></div>
        </div>
        <div class="desc">${p.experience}</div>
        <div class="buy-panel">${buyBlock}</div>
        <div id="compareBlock"></div>
      </div>
    </div>
    <div class="section-title">Parfumuri similare</div>
    <div class="similar-grid" id="similarGrid"></div>
  `;

  if(p.offers && p.offers.length > 0){
    const allOffers = [...p.offers];
    // adaugam si oferta curenta daca nu e deja in lista
    if(p.price.val && !allOffers.some(o=>o.buyLink===p.price.buyLink)){
      allOffers.push({store:p.price.src, price:p.price.val, buyLink:p.price.buyLink});
    }
    const parsePrice = s => parseFloat(String(s).replace(/[^\d.,]/g,'').replace(',','.'));
    allOffers.sort((a,b)=>parsePrice(a.price)-parsePrice(b.price));
    const minPrice = parsePrice(allOffers[0].price);
    document.getElementById('compareBlock').innerHTML = `
      <div class="compare-title">Compară prețul · ${allOffers.length} magazine</div>
      <div class="compare-table">
        ${allOffers.map(o=>`
          <div class="compare-row ${parsePrice(o.price)===minPrice?'best':''}">
            <div><span class="store">${o.store}</span>${parsePrice(o.price)===minPrice?'<span class="best-tag">Cel mai bun preț</span>':''}</div>
            <div class="cprice"><span class="val">${o.price}</span><a class="cbuy" href="${o.buyLink}" target="_blank" rel="nofollow sponsored noopener">Cumpără →</a></div>
          </div>`).join('')}
      </div>
    `;
  }

  const ranked = DATA.filter(d=>d.id!==p.id)
    .map(d=>({ d, score: jaccard(p, d) }))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,8);

  const simGrid = document.getElementById('similarGrid');
  if(ranked.length===0){
    simGrid.innerHTML = '<div style="color:var(--ink-soft); font-style:italic;">Niciun parfum suficient de apropiat ca notă, încă.</div>';
  } else {
    simGrid.innerHTML = ranked.map(({d,score})=>`
      <a class="sim-card" href="produs.html?id=${d.id}">
        <div class="simg">${d.image ? `<img src="${d.image}" alt="${d.brand} ${d.name}" loading="lazy">` : ''}</div>
        <div class="sbody">
          <div class="sbrand">${d.brand}</div>
          <div class="sname">${d.name}</div>
          <div class="smatch">${Math.round(score*100)}% note comune</div>
        </div>
      </a>`).join('');
  }
}
</script>
</body>
</html>
