<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surans — Detaliu parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root{
    --bg:#F7F7F5;
    --green:#37351B;
    --terracotta:#565436;
    --terracotta-deep:#1C1813;
    --ink:#1C1813;
    --ink-soft:#9599A0;
    --card:#FFFFFF;
    --line:#E8E7E3;
    --shadow: 0 4px 14px rgba(28,24,19,0.05);
    --shadow-hover: 0 10px 26px rgba(28,24,19,0.10);
    --teal:#76A6A3;
    --gold:#F0BB6E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; font-size:15.5px; line-height:1.6; }
  .serif{ font-family:'Fraunces',serif; }
  a{ color:inherit; }

  header{ padding:22px 48px; display:flex; justify-content:space-between; align-items:center; background:var(--bg); position:sticky; top:0; z-index:30; border-bottom:1px solid var(--line); }
  .wordmark-wrap{ text-decoration:none; }
  .wordmark{ font-family:'Inter',sans-serif; font-weight:900; font-size:20px; letter-spacing:.1em; color:var(--ink); display:block; text-transform:uppercase; }
  nav{ display:flex; gap:26px; font-size:11.5px; font-weight:600; align-items:center; text-transform:uppercase; letter-spacing:.08em; }
  nav a{ color:var(--ink); text-decoration:none; }
  nav a:hover{ color:var(--terracotta-deep); }
  .nav-cta{ background:var(--terracotta); color:#fff !important; padding:10px 20px; border-radius:2px; font-weight:700; font-size:11px; letter-spacing:.06em; }
  .nav-cta:hover{ background:var(--terracotta-deep); }
  .nav-toggle{ display:none; background:none; border:none; font-size:22px; line-height:1; color:var(--ink); cursor:pointer; padding:6px 4px; }

  .page-banner{ position:relative; min-height:180px; display:flex; align-items:flex-end; overflow:hidden; }
  .page-banner-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:75% 32%; z-index:0; }
  .page-banner-scrim{ position:absolute; inset:0; z-index:0; background:linear-gradient(180deg, rgba(247,247,245,0.45) 0%, rgba(247,247,245,0.9) 82%, var(--bg) 100%); }
  .breadcrumb{ position:relative; z-index:1; padding:20px 48px 18px; font-size:13px; color:var(--ink-soft); max-width:1100px; margin:0 auto; width:100%; }
  .breadcrumb a{ color:var(--terracotta-deep); text-decoration:none; font-weight:600; }

  main{ max-width:1100px; margin:0 auto; padding:16px 48px 90px; }

  .product-grid{ display:grid; grid-template-columns:420px 1fr; gap:44px; }
  .product-grid > *{ min-width:0; }
  @media (max-width:820px){ .product-grid{ grid-template-columns:1fr; } }

  .photo-box{ background:#fff; border-radius:20px; box-shadow:var(--shadow); height:460px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .photo-box img{ width:100%; height:100%; object-fit:contain; }
  .status-badge{ position:absolute; top:14px; right:14px; font-size:10px; font-weight:600; letter-spacing:.04em; padding:4px 11px; border-radius:12px; background:var(--bg); color:var(--ink-soft); }

  .info .brand{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:6px; }
  .info h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(28px,4vw,40px); line-height:1.1; margin-bottom:6px; color:var(--green); }
  .info .conc{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }

  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .tag{ font-size:10.5px; font-weight:500; padding:4px 11px; border-radius:10px; background:var(--bg); color:var(--ink-soft); }
  .tag.dupe{ border:1px solid var(--terracotta); color:var(--terracotta-deep); font-weight:600; background:transparent; }

  .pyramid{ background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:22px 24px; margin-bottom:22px; }
  .pyramid .level{ display:flex; gap:14px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .pyramid .level:last-child{ border-bottom:none; }
  .pyramid .level b{ width:64px; flex-shrink:0; font-family:'Fraunces',serif; font-size:15px; color:var(--terracotta); }
  .pyramid .level span{ color:var(--ink); }
  .pyramid .empty-note{ color:var(--ink-soft); font-style:italic; font-size:13px; }

  .desc{ font-family:'Fraunces',serif; font-style:italic; font-size:16.5px; color:var(--ink-soft); margin-bottom:26px; line-height:1.5; }

  .buy-panel{ display:flex; align-items:center; justify-content:space-between; background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:20px 24px; gap:16px; flex-wrap:wrap; }
  .buy-panel .price{ font-family:'Fraunces',serif; font-size:28px; font-weight:700; color:var(--green); }
  .buy-panel .src{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .buy-btn-lg{ background:var(--terracotta); color:#fff; text-decoration:none; font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; padding:14px 30px; border-radius:24px; white-space:nowrap; }
  .buy-btn-lg:hover{ background:var(--terracotta-deep); }
  .no-price{ font-style:italic; color:var(--ink-soft); }

  .compare-title{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:22px 0 10px; }
  .compare-table{ background:var(--card); box-shadow:var(--shadow); border-radius:14px; overflow:hidden; }
  .compare-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .compare-row:last-child{ border-bottom:none; }
  .compare-row.best{ background:#F2E4DC; }
  .compare-row .store{ font-weight:600; font-size:14px; }
  .compare-row .best-tag{ font-size:10px; font-weight:700; color:var(--terracotta-deep); text-transform:uppercase; letter-spacing:.04em; margin-left:8px; }
  .compare-row .cprice{ display:flex; align-items:center; gap:14px; }
  .compare-row .cprice .val{ font-family:'Fraunces',serif; font-size:18px; font-weight:700; color:var(--green); }
  .compare-row .cbuy{ background:var(--terracotta); color:#fff; text-decoration:none; font-size:12px; font-weight:700; padding:8px 15px; border-radius:16px; }
  .compare-row .cbuy:hover{ background:var(--terracotta-deep); }

  .section-title{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--green); margin:54px 0 20px; text-align:center; }
  .similar-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px; }
  .sim-card{ background:var(--card); box-shadow:var(--shadow); border-radius:16px; overflow:hidden; cursor:pointer; text-decoration:none; color:var(--ink); display:block; transition:transform .15s ease, box-shadow .15s ease; }
  .sim-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-hover); }
  .sim-card .simg{ height:150px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .sim-card .simg img{ width:100%; height:100%; object-fit:contain; }
  .sim-card .sbody{ padding:14px 16px; }
  .sim-card .sbrand{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
  .sim-card .sname{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--green); }
  .sim-card .smatch{ font-size:11px; color:var(--terracotta-deep); font-weight:600; margin-top:4px; }

  .not-found{ text-align:center; padding:100px 40px; }
  .not-found h1{ font-family:'Fraunces',serif; font-size:30px; margin-bottom:14px; color:var(--green); }
  .not-found a{ color:var(--terracotta-deep); font-weight:600; }

  footer{ padding:26px 48px 50px; font-size:12.5px; color:var(--ink-soft); text-align:center; border-top:1px solid var(--line); }

  @media (max-width:900px){
    header{ padding:16px 20px; position:relative; }
    .nav-toggle{ display:block; }
    nav{ display:none; position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch; gap:0; background:var(--bg); border-bottom:1px solid var(--line); padding:6px 20px 18px; box-shadow:var(--shadow-hover); }
    nav.open{ display:flex; }
    nav a{ padding:13px 2px; border-bottom:1px solid var(--line); }
    nav a:last-child{ border-bottom:none; }
    .nav-cta{ margin-top:10px; text-align:center; }
    .breadcrumb, main, footer{ padding-left:20px; padding-right:20px; }
  }
</style>
</head>
<body>

<header>
  <a class="wordmark-wrap" href="index.html"><span class="wordmark">SURANS</span></a>
  <button class="nav-toggle" id="navToggle" onclick="toggleMobileNav()" aria-label="Deschide meniul">☰</button>
  <nav id="mainNav">
    <a href="index.html">Descoperă</a>
    <a href="index.html#entries">Parfumuri</a>
    <a href="index.html#filterBlock">Note</a>
    <a href="index.html#filterBlock">Dupe Finder</a>
    <a href="index.html#comparatorBlock">Comparator</a>
    <a href="despre.html">Despre noi</a>
    <a class="nav-cta" href="index.html#searchInput">Găsește-mi parfumul</a>
  </nav>
</header>

<div class="page-banner">
  <img class="page-banner-photo" src="hero-perfume-2.jpg" alt="">
  <div class="page-banner-scrim"></div>
  <div class="breadcrumb" id="breadcrumb"></div>
</div>

<main id="main"></main>

<footer>SURANS · fiecare specimen e datat și sursat individual · afilierea nu influențează ordinea</footer>

<script>
function toggleMobileNav(){
  document.getElementById('mainNav').classList.toggle('open');
}
document.getElementById('mainNav').addEventListener('click', (e)=>{
  if(e.target.tagName==='A') document.getElementById('mainNav').classList.remove('open');
});

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const p = DATA.find(d => d.id === id);
const main = document.getElementById('main');
const crumb = document.getElementById('breadcrumb');

if(!p){
  crumb.innerHTML = '';
  main.innerHTML = `
    <div class="not-found">
      <h1>Nu am găsit acest parfum</h1>
      <p>Poate a fost mutat sau linkul e greșit. <a href="index.html">Înapoi la arhivă →</a></p>
    </div>`;
} else {
  document.title = `${p.brand} ${p.name} — Surans`;
  crumb.innerHTML = `<a href="index.html">Index</a> / ${p.brand} ${p.name}`;

  const dupeTag = p.dupeOf ? `<span class="tag dupe">Dupe: ${p.dupeOf}</span>` : '';
  const statusLabel = p.status==='verified' ? 'Verificat' : (p.status==='feed' ? 'Din feed' : 'Parțial');
  const visual = p.image
    ? `<img src="${p.image}" alt="${p.brand} ${p.name}">`
    : `<div class="serif" style="font-size:22px; color:var(--ink-soft);">${p.brand} ${p.name}</div>`;

  const buyBlock = p.price.buyLink
    ? `<div><div class="price">${p.price.val}</div><div class="src">${p.price.src}</div></div>
       <a class="buy-btn-lg" href="${p.price.buyLink}" target="_blank" rel="nofollow sponsored noopener">Cumpără →</a>`
    : `<div class="no-price">${p.price.src}</div>`;

  main.innerHTML = `
    <div class="product-grid">
      <div class="photo-box">
        <span class="status-badge">${statusLabel}</span>
        ${visual}
      </div>
      <div class="info">
        <div class="brand">${p.brand}</div>
        <h1>${p.name}</h1>
        <div class="conc">${p.conc}</div>
        <div class="tag-row">
          ${p.accords.map(a=>`<span class="tag">${a}</span>`).join('')}
          <span class="tag">${p.type}</span>
          <span class="tag">${p.gender}</span>
          ${dupeTag}
        </div>
        <div class="pyramid">
          <div class="level"><b>Vârf</b><span>${p.top.length ? p.top.join(', ') : '<span class="empty-note">nedocumentat</span>'}</span></div>
          <div class="level"><b>Inimă</b><span>${p.heart.length ? p.heart.join(', ') : '<span class="empty-note">nedocumentat</span>'}</span></div>
          <div class="level"><b>Bază</b><span>${p.base.length ? p.base.join(', ') : '<span class="empty-note">nedocumentat</span>'}</span></div>
        </div>
        <div class="desc">${p.experience}</div>
        <div class="buy-panel">${buyBlock}</div>
        <div id="compareBlock"></div>
      </div>
    </div>
    <div class="section-title">Parfumuri similare</div>
    <div class="similar-grid" id="similarGrid"></div>
  `;

  if(p.offers && p.offers.length > 0){
    const allOffers = [...p.offers];
    // adaugam si oferta curenta daca nu e deja in lista
    if(p.price.val && !allOffers.some(o=>o.buyLink===p.price.buyLink)){
      allOffers.push({store:p.price.src, price:p.price.val, buyLink:p.price.buyLink});
    }
    const parsePrice = s => parseFloat(String(s).replace(/[^\d.,]/g,'').replace(',','.'));
    allOffers.sort((a,b)=>parsePrice(a.price)-parsePrice(b.price));
    const minPrice = parsePrice(allOffers[0].price);
    document.getElementById('compareBlock').innerHTML = `
      <div class="compare-title">Compară prețul · ${allOffers.length} magazine</div>
      <div class="compare-table">
        ${allOffers.map(o=>`
          <div class="compare-row ${parsePrice(o.price)===minPrice?'best':''}">
            <div><span class="store">${o.store}</span>${parsePrice(o.price)===minPrice?'<span class="best-tag">Cel mai bun preț</span>':''}</div>
            <div class="cprice"><span class="val">${o.price}</span><a class="cbuy" href="${o.buyLink}" target="_blank" rel="nofollow sponsored noopener">Cumpără →</a></div>
          </div>`).join('')}
      </div>
    `;
  }

  const ranked = DATA.filter(d=>d.id!==p.id)
    .map(d=>({ d, score: jaccard(p, d) }))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,8);

  const simGrid = document.getElementById('similarGrid');
  if(ranked.length===0){
    simGrid.innerHTML = '<div style="color:var(--ink-soft); font-style:italic;">Niciun parfum suficient de apropiat ca notă, încă.</div>';
  } else {
    simGrid.innerHTML = ranked.map(({d,score})=>`
      <a class="sim-card" href="produs.html?id=${d.id}">
        <div class="simg">${d.image ? `<img src="${d.image}" alt="${d.brand} ${d.name}" loading="lazy">` : ''}</div>
        <div class="sbody">
          <div class="sbrand">${d.brand}</div>
          <div class="sname">${d.name}</div>
          <div class="smatch">${Math.round(score*100)}% note comune</div>
        </div>
      </a>`).join('');
  }
}
</script>
</body>
</html>
